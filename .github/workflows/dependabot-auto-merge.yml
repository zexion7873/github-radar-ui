name: Dependabot auto-merge

# pull_request_target runs this file from main with a write token; it never
# checks out the PR's code, so a malicious PR cannot rewrite what runs here.
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      # Pinned by SHA: this step runs with a write token on a public repo.
      - name: Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # A group's update-type is its largest member's, so a group carrying a
      # major falls through to a human like any individual major.
      - name: Enable auto-merge for minor and patch
        if: steps.meta.outputs.update-type == 'version-update:semver-minor' || steps.meta.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
