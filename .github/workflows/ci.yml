name: CI

on:
  push:
    branches: [main]
  pull_request:

# build-test runs third-party package code; without this it gets the repo-default
# token scope, which may include contents: write.
permissions:
  contents: read

# A newer push to the same branch/PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # build-test is a required check: skip it per job (skipped reports success), never
  # with a workflow-level paths filter, which leaves the check pending forever.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # On a PR, HEAD is the merge commit and HEAD^1 its base.
      - name: Detect non-doc changes
        id: diff
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] ||
            git diff --name-only HEAD^1 HEAD | grep -qvE '\.md$|^docs/'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # No env vars needed: every route is server-rendered on demand, so the
      # production build never reads Notion at build time.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test
