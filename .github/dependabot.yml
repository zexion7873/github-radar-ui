version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # @types/node majors track Node's Current line, but .nvmrc pins 22. Types ahead
    # of the runtime declare APIs it does not have, so a wrong call type-checks and
    # throws in production; types behind it fail loudly at build instead.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    # Exact-pinned packages that must move together. Ungrouped, Dependabot bumps
    # one side alone and `npm ci` fails ERESOLVE against the peer it left behind.
    groups:
      next:
        patterns:
          - next
          - eslint-config-next
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
