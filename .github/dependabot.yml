version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # Exact-pinned packages that must move together. Ungrouped, Dependabot bumps
    # one side alone and `npm ci` fails ERESOLVE against the peer it left behind.
    groups:
      next:
        patterns:
          - next
          - eslint-config-next
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
