version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # @types/node majors track Node's Current line, but .nvmrc pins 24. Types ahead
    # of the runtime declare APIs it does not have, so a wrong call type-checks and
    # throws in production; types behind it fail loudly at build instead.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    # Exact-pinned packages that must move together. Ungrouped, Dependabot bumps
    # one side alone and `npm ci` fails ERESOLVE against the peer it left behind.
    # A dependency joins the first group it matches, so these two stay above the
    # catch-all.
    groups:
      next:
        patterns:
          - next
          - eslint-config-next
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      # Everything else at minor/patch rides one weekly PR. Majors fall through to
      # individual PRs so each gets a human read, and security updates stay
      # ungrouped (applies-to defaults to version-updates) so they stay visible.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
